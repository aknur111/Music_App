services:
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "5436:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-music:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${MUSIC_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_music_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${MUSIC_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-playlist:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PLAYLIST_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - postgres_playlist_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${PLAYLIST_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-notification:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${NOTIFICATION_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-recommendation:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${RECOMMENDATION_DB_NAME}
    ports:
      - "5437:5432"
    volumes:
      - postgres_recommendation_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${RECOMMENDATION_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.56
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: backend-auth-service
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres-auth
      AUTH_DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aura.dev}
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "50051:50051"
    restart: unless-stopped

  music-service:
    build:
      context: ./music-service
      dockerfile: Dockerfile
    image: backend-music-service
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres-music
      MUSIC_DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres-music:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "50052:50052"
    restart: unless-stopped

  playlist-service:
    build:
      context: ./playlist-service
      dockerfile: Dockerfile
    image: backend-playlist-service
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres-playlist
      PLAYLIST_DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres-playlist:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "50053:50053"
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    image: backend-notification-service
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres-notification
      NOTIFICATION_DB_PORT: "5432"
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres-notification:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "50054:50054"
    restart: unless-stopped

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    image: backend-recommendation-service
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres-recommendation
      RECOMMENDATION_DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres-recommendation:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "50055:50055"
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: backend-api-gateway
    env_file:
      - .env
    environment:
      AUTH_SERVICE_ADDR: auth-service:50051
      MUSIC_SERVICE_ADDR: music-service:50052
      PLAYLIST_SERVICE_ADDR: playlist-service:50053
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      auth-service:
        condition: service_started
      music-service:
        condition: service_started
      playlist-service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.5
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

volumes:
  postgres_auth_data:
  postgres_music_data:
  postgres_playlist_data:
  postgres_notification_data:
  postgres_recommendation_data:
  redis_data:
  grafana_data: