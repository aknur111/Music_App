syntax = "proto3";

package recommendation;

option go_package = "github.com/music-app/recommendation-service/gen/recommendation;recommendation";

// ── Messages ──────────────────────────────────────────────────────────────────

message TrackProto {
  string id                = 1;
  string spotify_id        = 2;
  string name              = 3;
  string artists           = 4;
  string album             = 5;
  string genre             = 6;
  int32  duration_ms       = 7;
  int32  popularity        = 8;
  double valence           = 9;
  double energy            = 10;
  double danceability      = 11;
  double tempo             = 12;
  double acousticness      = 13;
  double instrumentalness  = 14;
  double loudness          = 15;
  double speechiness       = 16;
  string preview_url       = 17;
}

message MoodRequest {
  string mood  = 1;  // "happy" | "sad" | "energetic" | "chill" | "focus" | "workout" | "romantic" | "angry"
  int32  limit = 2;  // max results, default 20
}

message SimilarRequest {
  string track_id = 1;
  int32  limit    = 2;
}

message PersonalRequest {
  string user_id = 1;
  int32  limit   = 2;
}

message MoodRadioRequest {
  string mood = 1;
}

message PlaybackRequest {
  string user_id  = 1;
  string track_id = 2;
}

message TracksResponse {
  repeated TrackProto tracks = 1;
}

message PlaybackResponse {
  bool success = 1;
}

message TrendingRequest {
  int32 limit = 1;  // default 20
}

message RateTrackRequest {
  string user_id  = 1;
  string track_id = 2;
  int32  rating   = 3;  // 1 (dislike) or 5 (like)
}

message RateTrackResponse {
  bool success = 1;
}

message WaveRequest {
  string user_id        = 1;
  string mood_bias      = 2;  // optional: "happy"|"chill"|etc — blended 40% into profile vector
  int32  limit          = 3;  // default 30
  repeated string exclude_ids = 4;  // recently played track IDs to skip
}

// ── Service ───────────────────────────────────────────────────────────────────

service RecommendationService {
  rpc GetRecommendationsByMood(MoodRequest) returns (TracksResponse);
  rpc GetSimilarTracks(SimilarRequest) returns (TracksResponse);
  rpc GetPersonalRecommendations(PersonalRequest) returns (TracksResponse);
  rpc GetMoodRadio(MoodRadioRequest) returns (TracksResponse);
  rpc RecordPlayback(PlaybackRequest) returns (PlaybackResponse);
  rpc GetTrendingTracks(TrendingRequest) returns (TracksResponse);
  rpc RateTrack(RateTrackRequest) returns (RateTrackResponse);
  rpc GetMyWave(WaveRequest) returns (TracksResponse);
}
