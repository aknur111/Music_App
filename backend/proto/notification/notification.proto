syntax = "proto3";

package notification;

option go_package = "github.com/music-app/notification-service/gen/notification;notification";

// ── Messages ──────────────────────────────────────────────────────────────────

message SendEmailRequest {
  string to      = 1;
  string subject = 2;
  string body    = 3;
  bool   is_html = 4;
}

message SendEmailResponse {
  bool   success  = 1;
  string message  = 2;
}

message WelcomeEmailRequest {
  string to   = 1;
  string name = 2;
}

message PasswordResetEmailRequest {
  string to         = 1;
  string name       = 2;
  string reset_link = 3;
}

message PlaylistSharedEmailRequest {
  string to             = 1;
  string recipient_name = 2;
  string sender_name    = 3;
  string playlist_name  = 4;
  string playlist_link  = 5;
}

// ── Service ───────────────────────────────────────────────────────────────────

service NotificationService {
  rpc SendDirectEmail(SendEmailRequest) returns (SendEmailResponse);
  rpc SendWelcomeEmail(WelcomeEmailRequest) returns (SendEmailResponse);
  rpc SendPasswordResetEmail(PasswordResetEmailRequest) returns (SendEmailResponse);
  rpc SendPlaylistSharedEmail(PlaylistSharedEmailRequest) returns (SendEmailResponse);
}
