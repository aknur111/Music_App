global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:9090"]

  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:9090"]

  - job_name: "music-service"
    static_configs:
      - targets: ["music-service:9090"]

  - job_name: "playlist-service"
    static_configs:
      - targets: ["playlist-service:9090"]

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:9090"]

  - job_name: "nats"
    static_configs:
      - targets: ["nats:8222"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
