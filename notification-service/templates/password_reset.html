<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Password Reset</title></head>
<body style="font-family: sans-serif; padding: 20px;">
  <h1>Password Reset Request</h1>
  <p>We received a request to reset the password for your Music App account.</p>
  <p>Use the token below to reset your password. It expires in <strong>30 minutes</strong>.</p>
  <div style="background: #f4f4f4; padding: 12px; border-radius: 4px; font-size: 18px; letter-spacing: 2px;">
    {{.ResetToken}}
  </div>
  <p>If you did not request a password reset, please ignore this email.</p>
  <hr>
  <p style="color: #888; font-size: 12px;">Music App Security Team</p>
</body>
</html>
